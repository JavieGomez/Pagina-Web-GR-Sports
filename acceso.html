<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceder | GR Sports</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body data-page="auth">
<header class="site-header"><div class="container site-nav"><a class="site-brand" href="index.html"><img src="assets/logo.jpg" alt=""><span>GR <span class="accent">SPORTS</span></span></a><ul class="site-links"><li><a href="index.html">Inicio</a></li><li><a href="equipo.html">Personal</a></li></ul></div></header>
<main class="container page-shell"><div class="page-heading"><div class="angular-badge">Tu espacio GR Sports</div><h1>Accede a tu <span class="accent">cuenta</span></h1><p class="lead">Inicia sesión o crea una cuenta para confirmar solicitudes y seguir tus clases.</p></div><div id="auth-message" class="message" role="status"></div><div class="form-card">
<div class="toolbar" id="auth-tabs"><button type="button" class="btn btn-outline auth-tab active" data-auth-tab="login">Iniciar sesión</button><button type="button" class="btn btn-outline auth-tab" data-auth-tab="register">Crear cuenta</button></div>
<form id="login-form" data-auth-panel="login"><div class="form-group"><label for="login-email">Correo electrónico</label><input id="login-email" type="email" autocomplete="email" required></div><div class="form-group"><label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Entrar</button><button id="forgot-password" class="btn btn-outline" type="button" style="margin-top:10px">¿Olvidaste tu contraseña?</button></form>
<form id="password-reset-form" data-auth-panel="reset" class="hidden"><div class="form-group"><label for="new-password">Nueva contraseña</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-group"><label for="confirm-password">Repite la nueva contraseña</label><input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">Guardar contraseña</button><button id="reset-back" class="btn btn-outline" type="button" style="margin-top:10px">Volver al acceso</button></form>
<form id="register-form" data-auth-panel="register" class="hidden"><div class="form-row"><div class="form-group"><label for="register-name">Nombre y apellidos</label><input id="register-name" required autocomplete="name"></div><div class="form-group"><label for="register-phone">Teléfono</label><input id="register-phone" type="tel" autocomplete="tel"></div></div><div class="form-group"><label for="register-email">Correo electrónico</label><input id="register-email" type="email" required autocomplete="email"></div><div class="form-group"><label for="register-password">Contraseña</label><input id="register-password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn btn-primary" type="submit">Crear cuenta</button></form>
<p class="muted" style="margin-top:18px">Tus solicitudes y datos personales se guardarán en tu cuenta.</p></div></main><footer class="site-footer"><div class="container"><a href="index.html">← Volver a la página principal</a></div></footer></body></html>
